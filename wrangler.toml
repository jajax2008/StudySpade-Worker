name = "studyspace-ai"
main = "worker.js"
compatibility_date = "2024-11-01"

# Group Study voice rooms (max 5 people), keyed by 6-character room code.
[[kv_namespaces]]
binding = "STUDY_ROOMS"
id = "40f33862bd194f25a069330fac19f4ef"

# Accounts and cloud sync. Tables live in schema.sql and are applied on deploy.
[[d1_databases]]
binding = "DB"
database_name = "studyspace-db"
database_id = "9d2860e1-cc90-4365-817a-c423cf3e277a"
